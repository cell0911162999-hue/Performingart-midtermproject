<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>期中展演・兩分鐘走位動畫（含雙人舞）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1d1b18; --muted:#6f6a62; --paper:#f6f2ea; --card:#fffdf8; --line:#e3ddd1;
    --c0:#E4572E; --c1:#2E86DE; --c2:#2BAE66; --c3:#E9A800;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:"Noto Sans TC",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:780px;margin:0 auto;padding:14px 14px 40px}
  header h1{font-size:20px;font-weight:900;margin:4px 0 2px;letter-spacing:.02em}
  header p{margin:0 0 10px;color:var(--muted);font-size:13px}
  .legend{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
  .chip{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 10px 4px 5px;font-size:13px;font-weight:500}
  .dot{width:20px;height:20px;border-radius:50%;color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;flex:none}
  .stage{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
  svg#stage{display:block;width:100%;height:auto}
  .controls{display:flex;align-items:center;gap:8px;padding:10px 12px;border-top:1px solid var(--line)}
  button{font-family:inherit;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px;font-size:14px;font-weight:700;color:var(--ink);cursor:pointer}
  button.primary{background:var(--ink);color:#fff;border-color:var(--ink);min-width:64px}
  .time{font-variant-numeric:tabular-nums;font-weight:700;font-size:15px;margin-left:auto}
  .speed{display:flex;gap:4px}
  .speed button{padding:6px 8px;font-size:12px}
  .speed button.on{background:#ebe5d8}
  .timeline{position:relative;height:34px;margin:0 12px 12px;cursor:pointer;touch-action:none}
  .bands{position:absolute;inset:8px 0 8px 0;display:flex;border-radius:6px;overflow:hidden}
  .band{height:100%;border-right:2px solid var(--card);display:grid;place-items:center;font-size:10px;font-weight:700;color:#5b554c;background:#ece6da;white-space:nowrap;overflow:hidden}
  .band.on{background:#d9cfbc;color:var(--ink)}
  .head{position:absolute;top:2px;bottom:2px;width:3px;background:var(--ink);border-radius:2px;transform:translateX(-1px)}
  .segs{display:flex;gap:6px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none}
  .segs button{flex:none;font-size:13px;padding:7px 11px}
  .segs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:8px}
  .card h2{margin:0;font-size:18px;font-weight:900}
  .card .sub{color:var(--muted);font-size:13px;margin-top:2px}
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px}
  .tag{font-size:12px;background:#f1ece1;border-radius:8px;padding:4px 8px}
  .tag b{font-weight:700;margin-right:4px}
  .cues{list-style:none;padding:0;margin:10px 0 0;display:grid;gap:8px}
  .cues li{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.5}
  .music{display:flex;gap:10px;align-items:center;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);font-size:13px;color:#3d3933}
  .pulse{width:14px;height:14px;border-radius:50%;background:var(--ink);flex:none;transition:transform .05s}
  .ref{display:flex;gap:12px;align-items:center;margin-top:8px}
  .ref svg{width:150px;flex:none;background:#fff;border:1px solid var(--line);border-radius:10px}
  .ref p{margin:0;font-size:13px;color:var(--muted);line-height:1.5}
  .note{font-size:12px;color:var(--muted);margin-top:14px;line-height:1.6}
.music-up{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:0 12px 12px;font-size:13px}
  .music-up label{display:inline-flex;align-items:center;gap:6px;border:1px dashed #b9ad97;background:#fbf8f2;border-radius:10px;padding:8px 12px;font-weight:700;cursor:pointer}
  .music-up input{display:none}
  .music-up .fname{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:200px}
  .music-up .warn{color:#b4541f;width:100%}
  .music-up button{padding:6px 10px;font-size:12px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>期中展演・兩分鐘走位動畫</h1>
    <p>正面看舞台（觀眾視角）。人越往後越小；身體越矮代表 level 越低；頭上出現黑色「定」字＝定像（停住不動）。</p>
  </header>

  <div class="legend" id="legend"></div>

  <div class="stage">
    <svg id="stage" viewBox="0 0 800 440" aria-label="舞台走位動畫">
      <defs>
        <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#efe9dd"/><stop offset="1" stop-color="#e6dfd0"/>
        </linearGradient>
        <filter id="blur" x="-1" y="-1" width="3" height="3"><feGaussianBlur stdDeviation="6"/></filter>
      </defs>
      <rect x="0" y="0" width="800" height="230" fill="url(#wall)"/>
      <polygon points="0,440 800,440 655,230 145,230" fill="#f8f4ec"/>
      <line x1="145" y1="230" x2="655" y2="230" stroke="#d6cdbb" stroke-width="2"/>
      <text id="wallText" x="400" y="140" text-anchor="middle" font-size="86" font-weight="900" fill="#d9d0bf" opacity=".9"></text>
      <text id="wallSub" x="400" y="190" text-anchor="middle" font-size="18" font-weight="700" fill="#b7ac97"></text>
      <text x="400" y="432" text-anchor="middle" font-size="12" fill="#b7ac97">▲ 觀眾</text>
      <g id="paths"></g>
      <g id="people"></g>
    </svg>
    <div class="controls">
      <button class="primary" id="play">▶ 播放</button>
      <button id="restart" aria-label="從頭">⟲</button>
      <div class="speed" id="speed">
        <button data-s="0.5">0.5×</button><button data-s="1" class="on">1×</button><button data-s="2">2×</button>
      </div>
      <span class="time" id="time">0:00 / 2:20</span>
    </div>
    <div class="timeline" id="timeline">
      <div class="bands" id="bands"></div>
      <div class="head" id="headbar"></div>
    </div>
    <div class="music-up">
      <label>♪ 上傳音樂檔<input type="file" id="musicFile" accept="audio/*"></label>
      <span class="fname" id="fname">尚未選擇音樂（mp3、m4a、wav 都可以）</span>
      <button id="musicClear" hidden>移除</button>
      <span class="warn" id="mwarn" hidden></span>
    </div>
  </div>

  <div class="segs" id="segs"></div>

  <div class="card">
    <h2 id="segTitle"></h2>
    <div class="sub" id="segSub"></div>
    <div class="tags" id="segTags"></div>
    <ul class="cues" id="segCues"></ul>
    <div class="music"><span class="pulse" id="pulse"></span><span id="segMusic"></span></div>
  </div>

  <div class="card">
    <div style="font-weight:700;font-size:14px">對應原圖</div>
    <div class="ref">
      <svg id="ref" viewBox="330 300 1400 620" aria-label="原始圖像"></svg>
      <p id="refText"></p>
    </div>
  </div>

  <p class="note">動畫是走位示意，動作細節以排練為準。拖曳下方時間軸可以跳到任一秒；點段落按鈕可以直接看該段。上傳的音樂只在你自己的瀏覽器裡播放，不會傳到網路上；重新整理頁面後要再選一次。</p>
</div>

<script>
const COLORS=['#E4572E','#2E86DE','#2BAE66','#E9A800'];
const NAMES=['紅','藍','綠','黃'];
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>t<=0?0:t>=1?1:t*t*(3-2*t);
const sin=Math.sin, cos=Math.cos, PI=Math.PI;
const P=(x,z,h,aL,aR,lean=0,sw=8,glow=0,turn=0,fz=0)=>({x,z,h,aL,aR,lean,sw,glow,turn,fz});
const mix=(a,b,k)=>{const o={};for(const key in a)o[key]=lerp(a[key],b[key]??a[key],k);return o};
const F=p=>(p.fz=1,p);
/* 依時間分段，段與段之間 1 秒平滑銜接 */
function seq(t,parts,bl=1){let start=0;for(let j=0;j<parts.length;j++){const [end,fn]=parts[j];
  if(t<end||j===parts.length-1){let p=fn(t);if(j>0&&t-start<bl)p=mix(parts[j-1][1](start),p,ease((t-start)/bl));return p}start=end}}

const SEGS=[
 {key:'open',name:'開場',dur:8,wall:'點',wallSub:'POINT ・ 高中低定像',ele:'點',
  space:'四人散開成四個點',let:'高／中／低三種高度定像',
  music:'環境音慢慢淡入（AI 音效）',bpm:0,ref:[],
  refText:'整張圖的起點：四個人先是四個「點」，用高、中、低不同高度定像。',
  cues:['高位定像（雙手舉高）；0:01 第 1 個活過來','中位定像；0:02 第 2 個活過來','低位定像（蹲低）；0:04 第 3 個活過來','中位定像；0:05 第 4 個活過來'],
  pose(i,t){const p=[[180,.6,1,170],[340,.2,.72,90],[480,.7,.45,30],[640,.3,.72,90]][i];const tt=1.5+i*1.4;
    const k=ease((t-tt)/.6);const fr=P(p[0],p[1],p[2],p[3],p[3],0,8,0,0,1);
    const mv=P(p[0]+10*sin((t-tt)*2),p[1],p[2]+.05*sin((t-tt)*3),p[3]+25*sin((t-tt)*3),p[3]-25*sin((t-tt)*3),6*sin((t-tt)*2),8,.4);
    return mix(fr,mv,k)}},

 {key:'curve',name:'圓弧',dur:28,wall:'線',wallSub:'LINE ・ 由上往下、能量漸弱',ele:'線',
  space:'兩人一組斜對角；粗線先動、細線定像，再交換',let:'高→中→低／強→弱／快→慢',
  music:'約 70 BPM，由強到弱：大提琴長音＋鋼琴短句，樂器和音量慢慢減少',bpm:70,ref:['curves'],
  refText:'左邊兩條圓弧由上往下流動、能量越來越弱：動作從高位、大力，流到低位、輕柔。',
  cues:['粗線：0:08 先動，高位、動作大、有力；0:17 停在中位定像；0:26 一起往下流到低位','細線：0:08 先在低位定像；0:17 換你動，從中位往下流，輕、快；0:26 一起沉到地面','粗線：同紅（在右邊）','細線：同藍（在右邊）；0:33 全員低位定像'],
  pose(i,t){const b=[[200,.7],[300,.3],[500,.3],[600,.7]][i];const thick=i%2===0;const dir=thick?1:-1;
    const C=t=>{const k=ease((t-18)/7),A=(1-k);const base=thick?.75:.55;
      return P(b[0],b[1],lerp(base,.42,k)+.03*A*sin(t*1.5),lerp(thick?125:100,40,k)+30*A*sin(t*.9),lerp(thick?55:90,40,k)-30*A*sin(t*.9),10*A*sin(t*.8),thick?12:5,0,0,t>25.5?1:0)};
    if(thick)return seq(t,[
      [9,t=>P(b[0],b[1],lerp(1,.85,t/9)+.04*sin(t*1.2),90+75*sin(t*1.1),90+75*sin(t*1.1+PI),20*sin(t*1.1),12)],
      [18,t=>P(b[0]+15*dir,b[1],.75,125,55,-12*dir,12,0,0,1)],
      [99,C]]);
    return seq(t,[
      [9,t=>P(b[0],b[1],.5,40,60,10*dir,5,0,0,1)],
      [18,t=>{const u=(t-9)/9;return P(b[0]+25*sin(t*1.5),b[1],lerp(.85,.55,u)+.04*sin(t*3),100+35*(1-u*.4)*sin(t*4),100+35*(1-u*.4)*sin(t*4+1.5),6*sin(t*3),5)}],
      [99,C]])}},

 {key:'climb',name:'圈圈上階梯',dur:38,wall:'圓＋線',wallSub:'CIRCLES CLIMB THE STAIRS',ele:'面（圓）＋線（階梯）',
  space:'從左下沿斜線往右上',let:'低→中→高／圓越往上越小／一人動、其他人定像',
  music:'約 100 BPM：上行琶音，每有一個圓圈上台階就加一層樂器；1:11 一聲「叮」',bpm:100,ref:['steps','circles'],
  refText:'三個圓圈像在爬階梯：越往上越小、越高。黃負責「鋪階梯」。',
  cues:['大圓圈：0:38 轉著滾上第 1 階，低位定像（雙手圍大圓）','中圓圈：0:47 滾上第 2 階，中位定像','小圓圈：0:56 滾上第 3 階，高位定像（雙手圍小圓）','階梯：先跑到每一階後面平舉雙臂「鋪階梯」，圓圈到了就定像；1:05 四人一起轉一圈，1:11 定像'],
  pose(i,t){const S=[[230,.15,.45,120],[390,.45,.72,145],[550,.75,1,168]];
    const spinAll=t=>{const k=ease((t-29)/6);return k};
    if(i===3){
      return seq(t,[
        [0.5,t=>P(170,.27,.5,90,90,0,8,0,0,1)],
        [3,t=>P(270,.27,.5,90,90,0,8)],
        [9,t=>P(270,.27,.5,90,90,0,8,0,0,1)],
        [12,t=>P(430,.57,.72,90,90,0,8)],
        [18,t=>P(430,.57,.72,90,90,0,8,0,0,1)],
        [21,t=>P(590,.87,.95,90,90,0,8)],
        [29,t=>P(590,.87,.95,90,90,0,8,0,0,1)],
        [35,t=>P(590,.87,.95+.05*sin(PI*spinAll(t)),90,90,0,8,0,spinAll(t))],
        [99,t=>P(590,.87,.95,90,90,0,8,.4,1,1)]]);
    }
    const s=S[i],w=[[70,.05],[60,.32],[80,.58]][i],st=2+i*9;
    return seq(t,[
      [st,t=>P(w[0],w[1],.42,130,130,0,8,0,0,1)],
      [st+7,t=>{const u=ease((t-st)/7);return P(lerp(w[0],s[0],u),lerp(w[1],s[1],u),lerp(.42,s[2],u)+.1*Math.abs(sin(PI*u*3)),lerp(130,s[3],u),lerp(130,s[3],u),0,8,0,2*u)}],
      [29,t=>P(s[0],s[1],s[2],s[3],s[3],0,8,0,0,1)],
      [35,t=>{const k=spinAll(t);return P(s[0],s[1],s[2]+.06*sin(PI*k),s[3],s[3],0,8,0,k)}],
      [99,t=>P(s[0],s[1],s[2],s[3],s[3],0,8,.4,1,1)]],.6)}},

 {key:'duet',name:'雙人舞',dur:24,wall:'線＋面',wallSub:'雙人舞 ・ 一對跳、一對定像',ele:'線＋面',
  space:'兩對左右鏡像，輪流動',let:'高 vs 低對比／流暢／轉圈',
  music:'約 90 BPM 的搖擺律動（類似課堂練過的 Hit the Road Jack）',bpm:90,ref:[],
  refText:'原圖沒有雙人舞的圖形：這段連接「圓」和「蹺蹺板」，兩人牽手連成線、轉圈成面。',
  cues:['帶領：1:14 牽起藍的手高舉、帶她轉圈、換位；1:23 低位定像；1:32 兩對一起換位','跟隨：1:16 在紅手下轉一圈；1:23 高位定像；1:32 一起換位、一高一低交替','帶領：1:14 先高位定像；1:23 換你們跳（同紅的動作）；1:32 一起換位','跟隨：1:14 先低位定像；1:23 換你們跳（同藍的動作）；1:32 一起換位；1:36 全員定像'],
  pose(i,t){const A=i<2,cx=A?270:530,side=[-1,1,1,-1][i],lead=i===0||i===2,d=48,t0=A?0:9;
    const pos=t=>{const tau=t-t0;const sw=ease((tau-5)/3)+ease((t-18)/3);
      return [cx+side*d*cos(PI*sw),.45+(lead?-.16:.16)*sin(PI*sw),sw]};
    const arms=(inner,outer)=>side>0?[inner,outer]:[outer,inner];
    const active=t=>{const tau=t-t0,[x,z,sw]=pos(t);const raise=ease(tau-1)*(1-ease(tau-5));
      const spin=lead?0:ease((tau-2)/3);const [aL,aR]=arms(lerp(100,150,raise),lead?60:lerp(60,30,raise));
      return P(x,z,.85+(lead?0:.1*raise),aL,aR,-side*4*sin(t*2),8,0,spin+.5*sw)};
    const before=t=>{const [x,z,sw]=pos(t);const [aL,aR]=arms(lead?160:100,lead?120:40);return P(x,z,lead?1:.5,aL,aR,0,8,0,.5*sw,1)};
    const after=t=>{const [x,z,sw]=pos(t);const [aL,aR]=arms(lead?100:160,lead?40:130);return P(x,z,lead?.5:1,aL,aR,0,8,0,(lead?0:1)+.5*sw,1)};
    const fin=t=>{const [x,z,sw]=pos(t);const [aL,aR]=arms(95,60);
      return P(x,z,.78+.17*sin(2*PI*(t-18)/3+(lead?0:PI)),aL,aR,0,8,0,(lead?0:1)+.5*sw,t>22.5?1:0)};
    return A?seq(t,[[9,active],[18,after],[99,fin]]):seq(t,[[9,before],[18,active],[99,fin]])}},

 {key:'seesaw',name:'蹺蹺板',dur:27,wall:'面＋線',wallSub:'PLANE + LINE ・ 平衡',ele:'面＋線',
  space:'中心支點，兩側對稱',let:'支點低／木板中／兩端一高一低＋兩次定像',
  music:'3/4 拍或搖擺節奏，兩個音色左右聲道輪流；定像時音樂停一拍',bpm:90,ref:['seesaw'],
  refText:'右邊的三角形是蹺蹺板：綠當支點，黃當木板，紅藍坐兩端。',
  cues:['左端：一上一下；1:43、1:51 停在最高或最低點定像；1:56 牽手轉圈和藍換邊','右端：跟紅相反；定像時一個高、一個低','支點：中心低位，手腳撐成三角形，全程不動','木板：站在支點後方、中位，雙臂平舉跟著傾斜；定像時一起停'],
  pose(i,t){const hold=(t>=5&&t<7)||(t>=13&&t<15);
    const te=t-Math.max(0,Math.min(t,7)-5)-Math.max(0,Math.min(t,15)-13);
    const amp=te<20?1:1-ease((te-20)/3);const s=sin(2*PI*te/4)*amp;const fz=hold?1:0;
    if(i===2)return P(400,.55,.42,38,38,0,11,0,0,1);
    if(i===3)return P(400,.85,.78,90+22*s,90-22*s,0,8,0,0,fz);
    const u=ease((te-14)/6),ph=PI*u,spin=sin(ph);
    const x=i===0?400-150*cos(ph):400+150*cos(ph);const z=i===0?.35-.25*spin:.35+.3*spin;
    const left=(i===0)!==(u>.5);const so=left?s:-s;
    return P(x,z,lerp(.7+.26*so,.9,spin),lerp(90+60*so,170,spin),lerp(90+60*so,170,spin),-12*so*(1-spin),8,0,u,fz)}},

 {key:'end',name:'結尾',dur:10,wall:'點線面',wallSub:'回到整張圖',ele:'點線面',
  space:'回到原圖的構圖',let:'高／中／低同時定像',
  music:'回到第 1 段的長音，淡出',bpm:0,ref:['curves','steps','circles','seesaw'],
  refText:'全員回到原圖的位置定格：圓弧、圈圈上階梯、蹺蹺板一次呈現。',
  cues:['上方圓弧：高位，手臂彎成弧','下方圓弧：低位，身體往右延伸','階梯上的圓圈：高位，雙手圍小圓','蹺蹺板：中位，雙臂平舉，定像到音樂結束'],
  pose(i,t){const T=[P(190,.4,1,160,120,-14,12),P(270,.15,.48,60,115,18,5),P(470,.6,1,168,168,0,8),P(620,.4,.75,70,110,0,8)][i];
    T.glow=ease((t-6)/2)*.5;T.turn=1;T.fz=ease((t-3)/1);return T}}
];
let acc=0;SEGS.forEach(s=>{s.start=acc;acc+=s.dur});const TOTAL=acc;

function poseAt(i,t){
  let k=SEGS.length-1;for(let j=0;j<SEGS.length;j++){if(t<SEGS[j].start+SEGS[j].dur){k=j;break}}
  const s=SEGS[k],tl=Math.min(t-s.start,s.dur);let p=s.pose(i,tl);
  const bd=SEGS[k].key==='end'?3:2.5;
  if(k>0&&tl<bd){const pr=SEGS[k-1];p=mix(pr.pose(i,pr.dur),p,ease(tl/bd))}
  return {p,k,tl};
}
const proj=(x,z)=>{const s=1-.35*z;return [400+(x-400)*s,410-180*z,s]};

/* ---------- people ---------- */
const NS='http://www.w3.org/2000/svg';
const el=(tag,attrs,parent)=>{const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);parent&&parent.appendChild(e);return e};
const peopleG=document.getElementById('people');
const figs=COLORS.map((c,i)=>{
  const root=el('g',{},peopleG);
  const shadow=el('ellipse',{rx:22,ry:6,fill:'#000',opacity:.08},root);
  const g=el('g',{},root);
  const glow=el('circle',{r:26,fill:c,filter:'url(#blur)',opacity:0},g);
  const legL=el('polyline',{fill:'none',stroke:c,'stroke-linecap':'round','stroke-linejoin':'round'},g);
  const legR=el('polyline',{fill:'none',stroke:c,'stroke-linecap':'round','stroke-linejoin':'round'},g);
  const armL=el('line',{stroke:c,'stroke-linecap':'round'},g);
  const armR=el('line',{stroke:c,'stroke-linecap':'round'},g);
  const torso=el('rect',{x:-12,width:24,rx:11,fill:c},g);
  const head=el('circle',{r:14,fill:c},g);
  const num=el('text',{'text-anchor':'middle','font-size':14,'font-weight':900,fill:'#fff','dominant-baseline':'central'},g);
  num.textContent=i+1;
  const badge=el('g',{opacity:0},root);
  el('rect',{x:-15,y:-11,width:30,height:22,rx:7,fill:'#1d1b18'},badge);
  const bt=el('text',{'text-anchor':'middle','font-size':13,'font-weight':900,fill:'#fff','dominant-baseline':'central'},badge);bt.textContent='定';
  return {root,shadow,g,glow,legL,legR,armL,armR,torso,head,num,badge};
});
function drawPerson(f,p){
  const [X,Y,s]=proj(p.x,p.z);
  f.shadow.setAttribute('cx',X);f.shadow.setAttribute('cy',Y+2);f.shadow.setAttribute('rx',24*s);f.shadow.setAttribute('ry',6*s);
  f.g.setAttribute('transform',`translate(${X},${Y}) scale(${s*1.35}) rotate(${p.lean}) scale(${.3+.7*Math.abs(cos(2*PI*p.turn))},1)`);
  const h=Math.max(.38,Math.min(1.05,p.h));
  const legs=8+58*(h-.38)/.62, hip=-legs, sh=hip-38, kx=(1-h)*20;
  f.legL.setAttribute('points',`-7,0 ${-7-kx},${hip/2} -6,${hip}`);
  f.legR.setAttribute('points',`7,0 ${7+kx},${hip/2} 6,${hip}`);
  [f.legL,f.legR].forEach(l=>l.setAttribute('stroke-width',8));
  f.torso.setAttribute('y',sh);f.torso.setAttribute('height',38+6);
  const L=44,sy=sh+6;
  const ra=a=>a*PI/180;
  f.armL.setAttribute('x1',-9);f.armL.setAttribute('y1',sy);
  f.armL.setAttribute('x2',-9-sin(ra(p.aL))*L);f.armL.setAttribute('y2',sy+cos(ra(p.aL))*L);
  f.armR.setAttribute('x1',9);f.armR.setAttribute('y1',sy);
  f.armR.setAttribute('x2',9+sin(ra(p.aR))*L);f.armR.setAttribute('y2',sy+cos(ra(p.aR))*L);
  f.armL.setAttribute('stroke-width',p.sw);f.armR.setAttribute('stroke-width',p.sw);
  const hy=sh-17;f.head.setAttribute('cy',hy);f.num.setAttribute('y',hy);
  f.glow.setAttribute('cy',hy);
  const bs=s*1.35;f.badge.setAttribute('transform',`translate(${X},${Y+(hy-40)*bs}) scale(${Math.max(.75,bs)})`);
  f.badge.setAttribute('opacity',Math.max(0,Math.min(1,p.fz)));f.glow.setAttribute('opacity',Math.max(0,Math.min(1,p.glow))*.85);
}

/* ---------- floor guides ---------- */
const pathsG=document.getElementById('paths');
function guide(k){
  pathsG.innerHTML='';
  const line=(pts,dash=true,col='#cbbfa8',w=2.5)=>el('polyline',{points:pts.map(([x,z])=>proj(x,z).slice(0,2).join(',')).join(' '),fill:'none',stroke:col,'stroke-width':w,'stroke-dasharray':dash?'7 7':'','stroke-linecap':'round'},pathsG);
  const key=SEGS[k].key;
  const ring=(cx,cz,R,Rz,dash=true)=>{const pts=[];for(let a=0;a<=48;a++){const t=a/48*2*PI;pts.push([cx+R*cos(t),cz+Rz*sin(t)])}line(pts,dash)};
  if(key==='curve'){line([[200,.7],[300,.3]]);line([[500,.3],[600,.7]])}
  if(key==='climb'){line([[70,.05],[230,.15],[390,.45],[550,.75]]);
    [[230,.15,60],[390,.45,45],[550,.75,32]].forEach(([x,z,R])=>{line([[x-70,z],[x+70,z]],false,'#d8ceba',4);ring(x,z,R,.05,true)})}
  if(key==='duet'){ring(270,.45,48,.16);ring(530,.45,48,.16)}
  if(key==='seesaw'){line([[230,.35],[570,.35]]);const [a,b]=proj(400,.55);el('polygon',{points:`${a},${b-34} ${a-26},${b+6} ${a+26},${b+6}`,fill:'#e2d9c7'},pathsG)}
}

/* ---------- reference image ---------- */
const ref=document.getElementById('ref');
ref.innerHTML=`
<g data-k="curves" fill="none" stroke-linecap="butt"><path d="M490 685 C 430 520 420 400 520 375 C 600 355 700 365 780 383" stroke-width="14"/><path d="M400 875 C 420 750 460 690 520 678 C 570 670 620 695 658 723" stroke-width="5"/></g>
<g data-k="steps" stroke-width="5"><line x1="618" y1="877" x2="1017" y2="877"/><line x1="922" y1="782" x2="1322" y2="782"/></g>
<g data-k="circles" fill="none" stroke-width="5"><circle cx="1023" cy="589" r="97"/><circle cx="1244" cy="462" r="75"/><circle cx="1424" cy="384" r="51"/></g>
<g data-k="seesaw" stroke-width="5"><line x1="1260" y1="687" x2="1660" y2="687"/><polygon points="1458,688 1358,858 1557,858" stroke-width="0"/></g>`;
function refHi(keys){
  ref.querySelectorAll('g').forEach(g=>{const c=keys.includes(g.dataset.k)?'#1d1b18':'#d8d2c6';
    g.querySelectorAll('*').forEach(e=>{e.setAttribute('stroke',c);if(e.tagName==='polygon')e.setAttribute('fill',c)})});
}

/* ---------- UI ---------- */
const $=id=>document.getElementById(id);
$('legend').innerHTML=COLORS.map((c,i)=>`<span class="chip"><span class="dot" style="background:${c}">${i+1}</span>${i+1} 號・${NAMES[i]}</span>`).join('');
$('bands').innerHTML=SEGS.map((s,k)=>`<div class="band" data-k="${k}" style="width:${s.dur/TOTAL*100}%">${s.name}</div>`).join('');
$('segs').innerHTML=SEGS.map((s,k)=>`<button data-k="${k}">${k} ${s.name}</button>`).join('');
const fmt=t=>{t=Math.max(0,t);const m=Math.floor(t/60),s=Math.floor(t%60);return m+':'+String(s).padStart(2,'0')};

let t=0,playing=false,speed=1,last=null,curK=-1;
function setInfo(k){
  const s=SEGS[k];
  $('segTitle').textContent=`${k}｜${s.name}`;
  $('segSub').textContent=`${fmt(s.start)}–${fmt(s.start+s.dur)}（${s.dur} 秒）`;
  $('segTags').innerHTML=`<span class="tag"><b>點線面</b>${s.ele}</span><span class="tag"><b>隊形</b>${s.space}</span><span class="tag"><b>Level／Energy／Time</b>${s.let}</span>`;
  $('segCues').innerHTML=s.cues.map((c,i)=>`<li><span class="dot" style="background:${COLORS[i]}">${i+1}</span><span>${c}</span></li>`).join('');
  $('segMusic').textContent='音樂：'+s.music;
  $('wallText').textContent=s.wall;$('wallSub').textContent=s.wallSub;
  document.querySelectorAll('.band').forEach(b=>b.classList.toggle('on',+b.dataset.k===k));
  document.querySelectorAll('#segs button').forEach(b=>b.classList.toggle('on',+b.dataset.k===k));
  refHi(s.ref);$('refText').textContent=s.refText;
  guide(k);
}
function render(){
  const ps=COLORS.map((_,i)=>poseAt(i,Math.min(t,TOTAL-0.001)));
  const k=ps[0].k;if(k!==curK){curK=k;setInfo(k)}
  const order=ps.map((o,i)=>[o.p.z,i]).sort((a,b)=>b[0]-a[0]);
  order.forEach(([,i])=>{peopleG.appendChild(figs[i].root);drawPerson(figs[i],ps[i].p)});
  $('time').textContent=`${fmt(t)} / ${fmt(TOTAL)}`;
  $('headbar').style.left=(t/TOTAL*100)+'%';
  const s=SEGS[k];let sc=1;
  if(s.bpm&&playing){const ph=(t-s.start)*s.bpm/60%1;sc=1+.6*Math.max(0,1-ph*4)}
  $('pulse').style.transform=`scale(${sc})`;$('pulse').style.opacity=s.bpm?1:.25;
}
function frame(ts){
  if(playing){
    if(hasAudio&&!audio.paused&&!audio.ended&&audio.currentTime>0){t=audio.currentTime;last=ts}
    else{if(last!=null)t+=(ts-last)/1000*speed;last=ts}
    if(t>=TOTAL){t=TOTAL;playing=false;updBtn();audioSync()}}
  render();requestAnimationFrame(frame);
}
function updBtn(){$('play').textContent=playing?'❚❚ 暫停':'▶ 播放';last=null}
$('play').onclick=()=>{if(t>=TOTAL)t=0;playing=!playing;updBtn();audioSync()};
$('restart').onclick=()=>{t=0;playing=true;updBtn();audioSync()};
$('speed').onclick=e=>{const b=e.target.closest('button');if(!b)return;speed=+b.dataset.s;
  document.querySelectorAll('#speed button').forEach(x=>x.classList.toggle('on',x===b));audioSync()};
$('segs').onclick=e=>{const b=e.target.closest('button');if(!b)return;t=SEGS[+b.dataset.k].start+.01;playing=true;updBtn();audioSync()};
const tl=$('timeline');
const seek=e=>{const r=tl.getBoundingClientRect();t=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*TOTAL;last=null;audioSeek()};
let drag=false;
tl.addEventListener('pointerdown',e=>{drag=true;tl.setPointerCapture(e.pointerId);seek(e)});
tl.addEventListener('pointermove',e=>{if(drag)seek(e)});
tl.addEventListener('pointerup',()=>{drag=false;audioSeek()});
/* ---------- music ---------- */
const audio=new Audio();audio.preload='auto';let hasAudio=false,audioUrl=null;
function audioSeek(){if(hasAudio){try{audio.currentTime=Math.min(t,audio.duration||t)}catch(e){}}}
function audioSync(){
  if(!hasAudio)return;
  audio.playbackRate=speed;
  if(playing){audioSeek();const pr=audio.play();if(pr&&pr.catch)pr.catch(()=>{})}else audio.pause();
}
$('musicFile').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;
  if(audioUrl)URL.revokeObjectURL(audioUrl);
  audioUrl=URL.createObjectURL(f);audio.src=audioUrl;hasAudio=true;
  $('fname').textContent=f.name;$('musicClear').hidden=false;$('mwarn').hidden=true;
  playing=false;t=0;updBtn();audio.currentTime=0;
});
audio.addEventListener('loadedmetadata',()=>{
  const d=audio.duration;$('fname').textContent+=`（${fmt(d)}）`;
  if(Math.abs(d-TOTAL)>3){$('mwarn').hidden=false;
    $('mwarn').textContent=`提醒：音樂長 ${fmt(d)}，動畫長 ${fmt(TOTAL)}，兩者會從 0:00 一起開始，${d>TOTAL?'動畫結束時音樂會一起停':'音樂會比動畫早結束'}。`}
});
audio.addEventListener('ended',()=>{});
$('musicClear').onclick=()=>{audio.pause();audio.removeAttribute('src');audio.load();hasAudio=false;
  if(audioUrl)URL.revokeObjectURL(audioUrl);audioUrl=null;$('musicFile').value='';
  $('fname').textContent='尚未選擇音樂（mp3、m4a、wav 都可以）';$('musicClear').hidden=true;$('mwarn').hidden=true};
render();requestAnimationFrame(frame);
</script>
</body>
